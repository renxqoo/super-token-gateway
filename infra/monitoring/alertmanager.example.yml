route:
  receiver: stg-oncall
  group_by: [stg_cluster, alertname]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: stg-oncall
      matchers:
        - alertname="STGUpstreamUsageAnomaly"
      group_by: [stg_cluster, alertname, rule, severity]
receivers:
  - name: stg-oncall
    webhook_configs:
      - url: https://alert-receiver.internal/stg
        send_resolved: true
