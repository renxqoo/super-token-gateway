rule_files:
  - alerts.yml
evaluation_interval: 15s
tests:
  - name: Adaptive routing incompatibility alerts per model and cluster across replicas
    interval: 15s
    input_series:
      - series: 'gateway_adaptive_routing_decisions_total{job="stg-gateway",stg_cluster="ledger",instance="a",model="active-chat",mode="active",decision="incompatible"}'
        values: "1+1x8"
      - series: 'gateway_adaptive_routing_decisions_total{job="stg-gateway",stg_cluster="ledger",instance="b",model="active-chat",mode="active",decision="incompatible"}'
        values: "1+2x8"
      - series: 'gateway_adaptive_routing_decisions_total{job="stg-gateway",stg_cluster="ledger",instance="a",model="warmup-chat",mode="observe",decision="insufficient"}'
        values: "1+1x8"
    alert_rule_test:
      - eval_time: 30s
        alertname: STGAdaptiveRoutingIncompatible
        exp_alerts: []
      - eval_time: 2m
        alertname: STGAdaptiveRoutingIncompatible
        exp_alerts:
          - exp_labels: { stg_cluster: ledger, model: active-chat, mode: active, severity: warning }
            exp_annotations:
              {
                summary: Gateway suspended adaptive ranking for an incompatible model configuration,
              }
  - name: Gateway outage follows cluster readiness, including missing samples
    interval: 15s
    input_series:
      - series: 'gateway_ready{job="stg-gateway",stg_cluster="degraded",instance="a"}'
        values: "0+0x8"
      - series: 'gateway_ready{job="stg-gateway",stg_cluster="degraded",instance="b"}'
        values: "1+0x8"
      - series: 'gateway_ready{job="stg-gateway",stg_cluster="outage",instance="a"}'
        values: "0+0x8"
      - series: 'up{job="stg-gateway",stg_cluster="missing",instance="a"}'
        values: "0+0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: STGGatewayUnavailable
        exp_alerts:
          - exp_labels: { stg_cluster: outage, severity: critical }
            exp_annotations: { summary: No ready Gateway for the ledger cluster }
          - exp_labels: { stg_cluster: missing, severity: critical }
            exp_annotations: { summary: No ready Gateway for the ledger cluster }
  - name: Leader count detects missing leaders and split brain
    interval: 15s
    input_series:
      - series: 'stg_worker_leader{job="stg-worker",stg_cluster="healthy",instance="a"}'
        values: "1+0x8"
      - series: 'stg_worker_leader{job="stg-worker",stg_cluster="healthy",instance="b"}'
        values: "0+0x8"
      - series: 'stg_worker_leader{job="stg-worker",stg_cluster="split",instance="a"}'
        values: "1+0x8"
      - series: 'stg_worker_leader{job="stg-worker",stg_cluster="split",instance="b"}'
        values: "1+0x8"
      - series: 'up{job="stg-worker",stg_cluster="missing",instance="a"}'
        values: "0+0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: STGWorkerLeaderCount
        exp_alerts:
          - exp_labels: { stg_cluster: missing, severity: critical }
            exp_annotations: { summary: Ledger cluster should have exactly one Worker leader }
          - exp_labels: { stg_cluster: split, severity: critical }
            exp_annotations: { summary: Ledger cluster should have exactly one Worker leader }
  - name: Old holds aggregate by instance and standby does not duplicate alarms
    interval: 15s
    input_series:
      - series: 'stg_worker_leader{job="stg-worker",stg_cluster="ledger",instance="a"}'
        values: "1+0x12"
      - series: 'stg_worker_leader{job="stg-worker",stg_cluster="ledger",instance="b"}'
        values: "0+0x12"
      - series: 'stg_worker_expired_hold_timestamp_seconds{job="stg-worker",stg_cluster="ledger",instance="a"}'
        values: "1+0x12"
      - series: 'stg_worker_expired_supplier_lease_timestamp_seconds{job="stg-worker",stg_cluster="ledger",instance="a"}'
        values: "2+0x12"
      - series: 'stg_worker_expired_hold_timestamp_seconds{job="stg-worker",stg_cluster="ledger",instance="b"}'
        values: "1+0x12"
    alert_rule_test:
      - eval_time: 2m
        alertname: STGExpiredFundsPending
        exp_alerts:
          - exp_labels: { job: stg-worker, instance: a, stg_cluster: ledger, severity: critical }
            exp_annotations: { summary: Expired ledger hold or lease still awaits recovery }
  - name: Disabled and empty outboxes do not alarm
    interval: 15s
    input_series:
      - series: 'stg_worker_leader{instance="active"}'
        values: "1+0x16"
      - series: 'stg_worker_leader{instance="disabled"}'
        values: "1+0x16"
      - series: 'stg_worker_leader{instance="empty"}'
        values: "1+0x16"
      - series: 'stg_worker_outbox_enabled{instance="active"}'
        values: "1+0x16"
      - series: 'stg_worker_outbox_enabled{instance="disabled"}'
        values: "0+0x16"
      - series: 'stg_worker_outbox_enabled{instance="empty"}'
        values: "1+0x16"
      - series: 'stg_worker_outbox_head_timestamp_seconds{instance="active"}'
        values: "1+0x16"
      - series: 'stg_worker_outbox_head_timestamp_seconds{instance="disabled"}'
        values: "1+0x16"
      - series: 'stg_worker_outbox_head_timestamp_seconds{instance="empty"}'
        values: "0+0x16"
    alert_rule_test:
      - eval_time: 4m
        alertname: STGOutboxBacklog
        exp_alerts:
          - exp_labels: { instance: active, severity: warning }
            exp_annotations: { summary: Business webhook outbox consumer has an overdue event }
  - name: Anomaly notifications require a fresh enabled Console and deduplicate replicas
    interval: 15s
    input_series:
      - series: 'stg_console_usage_monitor_open_findings{job="stg-console",instance="a",stg_cluster="notify",rule="MAX_OUTPUT"}'
        values: "1+0x16"
      - series: 'stg_console_usage_monitor_open_findings{job="stg-console",instance="b",stg_cluster="notify",rule="MAX_OUTPUT"}'
        values: "2+0x16"
      - series: 'stg_console_usage_monitor_open_findings{job="stg-console",instance="a",stg_cluster="observation",rule="MAX_OUTPUT"}'
        values: "1+0x16"
      - series: 'stg_console_usage_monitor_open_findings{job="stg-console",instance="a",stg_cluster="stale",rule="MAX_OUTPUT"}'
        values: "1+0x16"
      - series: 'stg_console_usage_monitor_notifications_enabled{job="stg-console",instance="a",stg_cluster="notify"}'
        values: "1+0x16"
      - series: 'stg_console_usage_monitor_notifications_enabled{job="stg-console",instance="b",stg_cluster="notify"}'
        values: "1+0x16"
      - series: 'stg_console_usage_monitor_notifications_enabled{job="stg-console",instance="a",stg_cluster="observation"}'
        values: "0+0x16"
      - series: 'stg_console_usage_monitor_notifications_enabled{job="stg-console",instance="a",stg_cluster="stale"}'
        values: "1+0x16"
      - series: 'stg_console_usage_monitor_last_tick_timestamp_seconds{job="stg-console",instance="a",stg_cluster="notify"}'
        values: "1+15x16"
      - series: 'stg_console_usage_monitor_last_tick_timestamp_seconds{job="stg-console",instance="b",stg_cluster="notify"}'
        values: "1+15x16"
      - series: 'stg_console_usage_monitor_last_tick_timestamp_seconds{job="stg-console",instance="a",stg_cluster="observation"}'
        values: "1+15x16"
      - series: 'stg_console_usage_monitor_last_tick_timestamp_seconds{job="stg-console",instance="a",stg_cluster="stale"}'
        values: "1+0x16"
    alert_rule_test:
      - eval_time: 4m
        alertname: STGUpstreamUsageAnomaly
        exp_alerts:
          - exp_labels: { stg_cluster: notify, rule: MAX_OUTPUT, severity: warning }
            exp_annotations: { summary: Settled upstream usage requires platform review }
  - name: Usage monitoring reports stalled processing and skipped coverage
    interval: 15s
    input_series:
      - series: 'stg_console_usage_monitor_enabled{job="stg-console",instance="a",stg_cluster="idle"}'
        values: "1+0x28"
      - series: 'stg_console_usage_monitor_enabled{job="stg-console",instance="a",stg_cluster="backlog"}'
        values: "1+0x28"
      - series: 'stg_console_usage_monitor_last_tick_timestamp_seconds{job="stg-console",instance="a",stg_cluster="idle"}'
        values: "0+0x28"
      - series: 'stg_console_usage_monitor_last_tick_timestamp_seconds{job="stg-console",instance="a",stg_cluster="backlog"}'
        values: "1+15x28"
      - series: 'stg_console_usage_monitor_oldest_due_timestamp_seconds{job="stg-console",instance="a",stg_cluster="backlog"}'
        values: "1+0x28"
      - series: 'stg_console_usage_monitor_coverage_gaps{job="stg-console",instance="a",stg_cluster="gap"}'
        values: "0+0x28"
      - series: 'stg_console_usage_monitor_last_skip_timestamp_seconds{job="stg-console",instance="a",stg_cluster="gap"}'
        values: "1+0x28"
    alert_rule_test:
      - eval_time: 7m
        alertname: STGUsageMonitorCoverageGap
        exp_alerts:
          - exp_labels: { stg_cluster: gap, severity: warning }
            exp_annotations: { summary: Upstream usage monitoring has incomplete window coverage }
      - eval_time: 7m
        alertname: STGUsageMonitorStale
        exp_alerts:
          - exp_labels: { job: stg-console, instance: a, stg_cluster: idle, severity: warning }
            exp_annotations:
              { summary: Upstream usage monitoring has stalled evaluation or backlog }
          - exp_labels: { job: stg-console, instance: a, stg_cluster: backlog, severity: warning }
            exp_annotations:
              { summary: Upstream usage monitoring has stalled evaluation or backlog }

  - name: failed Console scrape pages even without monitor metrics and clears on recovery
    interval: 15s
    input_series:
      - series: 'up{job="stg-console",instance="console-a",stg_cluster="test"}'
        values: "1 0+0x7 1+0x4"
      - series: 'up{job="stg-console",instance="console-b",stg_cluster="test"}'
        values: "1+0x12"
    alert_rule_test:
      - eval_time: 1m30s
        alertname: STGInstanceScrapeFailed
        exp_alerts:
          - exp_labels:
              job: stg-console
              instance: console-a
              stg_cluster: test
              severity: warning
            exp_annotations:
              summary: Gateway, Worker or Console metrics endpoint is unreachable
      - eval_time: 2m30s
        alertname: STGInstanceScrapeFailed
        exp_alerts: []
