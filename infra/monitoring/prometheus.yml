global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: stg-gateway
    static_configs:
      - targets: ["127.0.0.1:8081", "127.0.0.1:8181"]
        labels:
          stg_cluster: gateway-prod
  - job_name: stg-worker
    static_configs:
      - targets: ["127.0.0.1:8090", "127.0.0.1:8190"]
        labels:
          stg_cluster: gateway-prod
